<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Čus, uděláme to video o AI Gigafactories?</title>
    <meta
      name="description"
      content="Interaktivní rozhodovací aplikace ve stylu Close Friends."
    />
    <meta property="og:title" content="Čus, uděláme to video o AI Gigafactories?" />
    <meta
      property="og:description"
      content="Interaktivní rozhodovací aplikace ve stylu Close Friends."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Google Fonts: Plus Jakarta Sans & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Outfit:wght@700;800;900&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        /* Palette from the Close Friends screenshot */
        --cf-mint-bg: #6cbf8f;         /* Signature mint/sage green background */
        --cf-mint-light: #7ecfa0;      /* Slightly brighter mint for glow */
        --cf-mint-dark: #58a87b;       /* Deeper tone for borders & accents */
        --cf-ink: #111613;              /* Rich dark ink from hair/shadows */
        --cf-cream: #faf8f0;            /* Warm parchment / skin highlight */
        --cf-card-bg: rgba(255, 255, 255, 0.94);
        --cf-card-border: rgba(17, 22, 19, 0.1);
        --cf-text-main: #111613;
        --cf-text-muted: #4e5751;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        min-height: 100dvh;
        overflow-x: hidden;
        background-color: var(--cf-mint-bg);
        color: var(--cf-text-main);
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      /* Ambient soft glow on mint backdrop */
      .ambient-glow {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 0;
        overflow: hidden;
      }

      .glow-orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(100px);
        opacity: 0.35;
        pointer-events: none;
      }

      .glow-orb-mint {
        width: 600px;
        height: 600px;
        background: radial-gradient(circle, rgba(255, 255, 255, 0.45) 0%, rgba(108, 191, 143, 0) 70%);
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        animation: pulseGlow 10s ease-in-out infinite alternate;
      }

      @keyframes pulseGlow {
        0% {
          transform: translate(-50%, -50%) scale(0.92);
          opacity: 0.28;
        }
        100% {
          transform: translate(-50%, -50%) scale(1.12);
          opacity: 0.42;
        }
      }

      /* Subtle dot texture */
      .grid-pattern {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 1;
        background-size: 28px 28px;
        background-image: radial-gradient(rgba(17, 22, 19, 0.07) 1.2px, transparent 1.2px);
      }

      /* Main presentation frame */
      .app-wrapper {
        position: relative;
        z-index: 10;
        width: 100%;
        max-width: 740px;
        padding: 1.5rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }

      .app-card {
        width: 100%;
        background: var(--cf-card-bg);
        border: 1px solid var(--cf-card-border);
        border-radius: 32px;
        padding: 3.75rem 2.5rem;
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        box-shadow: 
          0 24px 60px -15px rgba(17, 22, 19, 0.2),
          0 4px 16px rgba(17, 22, 19, 0.06),
          inset 0 1px 0 rgba(255, 255, 255, 0.9);
        text-align: center;
        position: relative;
        transition: transform 0.3s ease, border-color 0.3s ease;
      }

      /* Main Heading */
      #main-heading {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: clamp(2rem, 5.5vw, 3.4rem);
        font-weight: 800;
        line-height: 1.15;
        letter-spacing: -0.035em;
        color: var(--cf-ink);
        text-wrap: balance;
        margin-bottom: 1.25rem;
        transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
      }

      #main-heading:has(+ #sub-heading:empty) {
        margin-bottom: 2.25rem;
      }

      #sub-heading {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: clamp(0.85rem, 2.2vw, 0.975rem);
        font-weight: 500;
        color: var(--cf-text-muted);
        line-height: 1.5;
        max-width: 500px;
        margin: 0 auto 2rem;
        text-wrap: balance;
        transition: opacity 0.3s ease;
      }

      #sub-heading:empty {
        display: none;
        margin: 0;
      }

      /* Action controls zone */
      .action-zone {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.25rem;
        width: 100%;
        position: relative;
        min-height: 64px;
      }

      .primary-buttons {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        flex-wrap: wrap;
        width: 100%;
        position: relative;
      }

      /* Base button styling */
      .btn {
        min-height: 52px;
        min-width: 140px;
        padding: 0.95rem 2.5rem;
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 1.125rem;
        font-weight: 800;
        letter-spacing: -0.01em;
        border-radius: 9999px; /* Signature pill shape */
        border: none;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        touch-action: manipulation;
        user-select: none;
        -webkit-user-select: none;
        position: relative;
        transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), 
                    box-shadow 0.2s cubic-bezier(0.16, 1, 0.3, 1), 
                    background-color 0.2s ease,
                    opacity 0.3s ease;
      }

      .btn:focus-visible {
        outline: 2px solid var(--cf-ink);
        outline-offset: 4px;
      }

      /* ANO Button - Bold Ink Pill from the screenshot's high-contrast print style */
      .btn-ano {
        background-color: var(--cf-ink);
        color: var(--cf-cream);
        box-shadow: 
          0 6px 20px rgba(17, 22, 19, 0.3),
          0 1px 3px rgba(17, 22, 19, 0.15);
      }

      .btn-ano:hover {
        background-color: #202722;
        transform: scale(1.05) translateY(-2px);
        box-shadow: 
          0 10px 30px rgba(17, 22, 19, 0.45),
          0 2px 6px rgba(17, 22, 19, 0.25);
      }

      .btn-ano:active {
        transform: scale(0.98) translateY(0);
      }

      /* NE Button - Clean light pill */
      .btn-ne {
        background: #f3f2eb;
        color: var(--cf-ink);
        border: 1.5px solid rgba(17, 22, 19, 0.16);
        box-shadow: 0 4px 12px rgba(17, 22, 19, 0.05);
        z-index: 100;
        transition: transform 0.25s cubic-bezier(0.34, 1.4, 0.64, 1),
                    background-color 0.2s ease,
                    box-shadow 0.2s ease;
      }

      .btn-ne:hover {
        background: #e8e6dc;
        border-color: rgba(17, 22, 19, 0.3);
      }

      /* When escaping around the screen */
      .btn-ne.is-escaping {
        position: fixed !important;
        margin: 0 !important;
        background: #ffffff !important;
        box-shadow: 
          0 12px 30px rgba(17, 22, 19, 0.28),
          0 0 16px rgba(239, 68, 68, 0.2);
        border-color: rgba(239, 68, 68, 0.4);
        transition: left 0.32s cubic-bezier(0.34, 1.35, 0.64, 1),
                    top 0.32s cubic-bezier(0.34, 1.35, 0.64, 1),
                    transform 0.25s ease-out;
      }

      /* Dramatic drop off the screen */
      .btn-ne.falling {
        pointer-events: none !important;
        transition: transform 0.85s cubic-bezier(0.55, 0, 1, 0.45),
                    opacity 0.85s ease-in !important;
        transform: translateY(120vh) rotate(48deg) scale(0.5) !important;
        opacity: 0 !important;
      }

      /* Morphed state: when NE turns into Yessir */
      .btn-ne.morphed-yessir {
        background-color: var(--cf-ink) !important;
        color: var(--cf-cream) !important;
        border-color: transparent !important;
        box-shadow: 
          0 6px 20px rgba(17, 22, 19, 0.35),
          0 0 16px rgba(108, 191, 143, 0.45) !important;
        animation: morphPop 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      @keyframes morphPop {
        0% { transform: scale(0.85); }
        50% { transform: scale(1.15); }
        100% { transform: scale(1); }
      }

      /* Replay / Restart Control */
      .reset-control {
        margin-top: 2rem;
        opacity: 0;
        transform: translateY(10px);
        pointer-events: none;
        transition: opacity 0.4s ease, transform 0.4s ease;
      }

      .reset-control.visible {
        opacity: 1;
        transform: translateY(0);
        pointer-events: auto;
      }

      .btn-reset {
        background: transparent;
        border: 1.5px solid rgba(17, 22, 19, 0.2);
        color: var(--cf-ink);
        padding: 0.5rem 1.35rem;
        font-size: 0.875rem;
        font-weight: 600;
        border-radius: 9999px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        transition: all 0.2s ease;
      }

      .btn-reset:hover {
        background: rgba(17, 22, 19, 0.06);
        border-color: var(--cf-ink);
      }

      /* Celebration Canvas */
      #celebration-canvas {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        pointer-events: none;
        z-index: 50;
      }

      /* Audio toggle */
      .audio-toggle {
        position: fixed;
        top: 1.25rem;
        right: 1.25rem;
        z-index: 40;
        background: rgba(255, 255, 255, 0.85);
        border: 1px solid rgba(17, 22, 19, 0.12);
        color: var(--cf-ink);
        box-shadow: 0 4px 12px rgba(17, 22, 19, 0.08);
        border-radius: 9999px;
        width: 42px;
        height: 42px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .audio-toggle:hover {
        background: #ffffff;
        transform: scale(1.05);
      }

      /* Mobile responsiveness */
      @media (max-width: 640px) {
        .app-card {
          padding: 2.75rem 1.35rem;
          border-radius: 26px;
        }

        #main-heading {
          margin-bottom: 2rem;
        }

        .primary-buttons {
          gap: 1rem;
        }

        .btn {
          min-height: 50px;
          padding: 0.85rem 2rem;
          font-size: 1.05rem;
        }

        .btn-alternative {
          font-size: 0.9375rem;
          padding: 0.85rem 1.25rem;
        }
      }
    </style>
  </head>
  <body>
    <!-- Ambient mint glow -->
    <div class="ambient-glow" aria-hidden="true">
      <div class="glow-orb glow-orb-mint"></div>
    </div>

    <!-- Background dot grid -->
    <div class="grid-pattern" aria-hidden="true"></div>

    <!-- Sound toggle -->
    <button
      id="audio-toggle"
      class="audio-toggle"
      title="Přepnout zvukové efekty"
      aria-label="Přepnout zvukové efekty"
    >
      <svg id="sound-icon-on" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
      </svg>
      <svg id="sound-icon-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
        <line x1="23" y1="9" x2="17" y2="15"></line>
        <line x1="17" y1="9" x2="23" y2="15"></line>
      </svg>
    </button>

    <!-- Canvas for smooth confetti animation -->
    <canvas id="celebration-canvas" aria-hidden="true"></canvas>

    <!-- Main Container -->
    <main class="app-wrapper">
      <div class="app-card" id="app-card">
        <!-- Main Heading -->
        <h1 id="main-heading">Čus, uděláme to video o AI Gigafactories?</h1>

        <!-- Context Sub-heading (clean/empty) -->
        <p id="sub-heading"></p>

        <!-- Actions Container -->
        <div class="action-zone" id="action-zone">
          <div class="primary-buttons" id="primary-buttons">
            <button
              id="btn-ano"
              class="btn btn-ano"
              type="button"
              aria-label="Yesssir"
            >
              Yesssir
            </button>
            <button
              id="btn-ne"
              class="btn btn-ne"
              type="button"
              aria-label="NE"
            >
              NE
            </button>
          </div>
        </div>

        <!-- Restart control -->
        <div class="reset-control" id="reset-control">
          <button class="btn-reset" id="btn-reset" type="button">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
              <path d="M3 3v5h5"></path>
            </svg>
            Zkusit znovu
          </button>
        </div>
      </div>
    </main>

    <!-- JavaScript Logic -->
    <script>
      (function () {
        'use strict';

        // DOM elements
        const heading = document.getElementById('main-heading');
        const subHeading = document.getElementById('sub-heading');
        const btnAno = document.getElementById('btn-ano');
        const btnNe = document.getElementById('btn-ne');
        const resetControl = document.getElementById('reset-control');
        const btnReset = document.getElementById('btn-reset');
        const canvas = document.getElementById('celebration-canvas');
        const ctx = canvas.getContext('2d');
        const audioToggle = document.getElementById('audio-toggle');
        const soundIconOn = document.getElementById('sound-icon-on');
        const soundIconOff = document.getElementById('sound-icon-off');

        // State
        let jumpCount = 0;
        let isEscaped = false;
        let isReturned = false;
        let isTransformed = false;
        let placeholder = null;
        let soundEnabled = true;

        // Sound generator via Web Audio API
        let audioCtx = null;
        function getAudioContext() {
          if (!audioCtx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (AudioContext) {
              audioCtx = new AudioContext();
            }
          }
          if (audioCtx && audioCtx.state === 'suspended') {
            audioCtx.resume();
          }
          return audioCtx;
        }

        function playSound(type) {
          if (!soundEnabled) return;
          try {
            const ctx = getAudioContext();
            if (!ctx) return;

            const now = ctx.currentTime;

            if (type === 'escape') {
              const osc = ctx.createOscillator();
              const gain = ctx.createGain();
              osc.type = 'sine';
              osc.frequency.setValueAtTime(340 + jumpCount * 90, now);
              osc.frequency.exponentialRampToValueAtTime(780 + jumpCount * 120, now + 0.15);

              gain.gain.setValueAtTime(0.2, now);
              gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);

              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(now);
              osc.stop(now + 0.17);
            } else if (type === 'fall') {
              const osc = ctx.createOscillator();
              const gain = ctx.createGain();
              osc.type = 'triangle';
              osc.frequency.setValueAtTime(620, now);
              osc.frequency.exponentialRampToValueAtTime(100, now + 0.6);

              gain.gain.setValueAtTime(0.25, now);
              gain.gain.linearRampToValueAtTime(0.2, now + 0.35);
              gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);

              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(now);
              osc.stop(now + 0.62);
            } else if (type === 'victory') {
              const notes = [440, 554.37, 659.25, 880, 1108.73];
              notes.forEach((freq, i) => {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                const noteTime = now + i * 0.08;

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, noteTime);

                gain.gain.setValueAtTime(0.22, noteTime);
                gain.gain.exponentialRampToValueAtTime(0.001, noteTime + 0.4);

                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start(noteTime);
                osc.stop(noteTime + 0.45);
              });
            } else if (type === 'morph') {
              const osc = ctx.createOscillator();
              const gain = ctx.createGain();
              osc.type = 'sine';
              osc.frequency.setValueAtTime(440, now);
              osc.frequency.exponentialRampToValueAtTime(880, now + 0.18);

              gain.gain.setValueAtTime(0.25, now);
              gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);

              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(now);
              osc.stop(now + 0.22);
            }
          } catch (e) {
            // Audio policy fallback
          }
        }

        // Toggle sound
        audioToggle.addEventListener('click', function () {
          soundEnabled = !soundEnabled;
          soundIconOn.style.display = soundEnabled ? 'block' : 'none';
          soundIconOff.style.display = soundEnabled ? 'none' : 'block';
        });

        // Confetti Engine with Palette from Screenshot
        let confettiParticles = [];
        let confettiAnimationId = null;

        function resizeCanvas() {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function createConfettiBurst() {
          // Screenshot palette: mint green, dark ink, warm cream, pure white
          const colors = ['#6cbf8f', '#58a87b', '#111613', '#faf8f0', '#ffffff', '#7ecfa0'];

          const particleCount = 140;
          const originX = canvas.width / 2;
          const originY = canvas.height * 0.48;

          for (let i = 0; i < particleCount; i++) {
            const angle = Math.random() * Math.PI * 2;
            const velocity = 5 + Math.random() * 14;
            confettiParticles.push({
              x: originX,
              y: originY,
              vx: Math.cos(angle) * velocity,
              vy: Math.sin(angle) * velocity - 4,
              size: 6 + Math.random() * 8,
              color: colors[Math.floor(Math.random() * colors.length)],
              rotation: Math.random() * 360,
              rotationSpeed: (Math.random() - 0.5) * 12,
              gravity: 0.28,
              drag: 0.98,
              opacity: 1,
              decay: 0.008 + Math.random() * 0.008,
              shape: Math.random() > 0.4 ? 'rect' : 'circle',
            });
          }

          if (!confettiAnimationId) {
            animateConfetti();
          }
        }

        function animateConfetti() {
          ctx.clearRect(0, 0, canvas.width, canvas.height);

          for (let i = confettiParticles.length - 1; i >= 0; i--) {
            const p = confettiParticles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.vy += p.gravity;
            p.vx *= p.drag;
            p.vy *= p.drag;
            p.rotation += p.rotationSpeed;
            p.opacity -= p.decay;

            if (p.opacity <= 0 || p.y > canvas.height + 50) {
              confettiParticles.splice(i, 1);
              continue;
            }

            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate((p.rotation * Math.PI) / 180);
            ctx.globalAlpha = Math.max(0, p.opacity);
            ctx.fillStyle = p.color;

            if (p.shape === 'circle') {
              ctx.beginPath();
              ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
              ctx.fill();
            } else {
              ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
            }

            ctx.restore();
          }

          if (confettiParticles.length > 0) {
            confettiAnimationId = requestAnimationFrame(animateConfetti);
          } else {
            confettiAnimationId = null;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
          }
        }

        // Morph NE into Yessir!
        function morphToYessir() {
          if (isTransformed) return;
          isTransformed = true;
          btnNe.textContent = 'Yessir';
          btnNe.setAttribute('aria-label', 'Yessir');
          btnNe.classList.add('morphed-yessir');
          playSound('morph');
        }

        // Shared victory trigger
        function triggerVictory(source) {
          heading.style.opacity = '0';
          subHeading.style.opacity = '0';
          heading.style.transform = 'scale(0.95)';

          setTimeout(() => {
            heading.textContent = 'letsgooo kamo tak já jsem nejotravnější člověk na světě';
            heading.style.opacity = '1';
            heading.style.transform = 'scale(1)';

            if (source === 'yesssir') {
              subHeading.textContent = 'ale pls zkus ještě kliknout na "ne", sral jsem se s tim designem;)))';
              subHeading.style.opacity = '1';
            } else {
              subHeading.textContent = '';
              subHeading.style.opacity = '0';
            }

            createConfettiBurst();
            playSound('victory');

            resetControl.classList.add('visible');
          }, 200);
        }

        // NE Button Escape Logic
        function escapeNeButton(e) {
          // If already returned or morphed, do not escape - morph to Yessir!
          if (isReturned || isTransformed) {
            morphToYessir();
            return;
          }

          if (jumpCount >= 3) return;

          if (e && e.cancelable) {
            e.preventDefault();
          }
          if (e && e.stopPropagation) {
            e.stopPropagation();
          }

          jumpCount++;

          const rect = btnNe.getBoundingClientRect();
          const btnWidth = rect.width;
          const btnHeight = rect.height;

          // Compute safe viewport bounds
          const padding = 20;
          const screenW = window.innerWidth;
          const screenH = window.innerHeight;

          const minX = padding;
          const maxX = Math.max(padding, screenW - btnWidth - padding);
          const minY = padding;
          const maxY = Math.max(padding, screenH - btnHeight - padding);

          const currentCenterX = rect.left + btnWidth / 2;
          const currentCenterY = rect.top + btnHeight / 2;

          let targetX = minX;
          let targetY = minY;

          let attempts = 0;
          do {
            targetX = Math.floor(minX + Math.random() * (maxX - minX));
            targetY = Math.floor(minY + Math.random() * (maxY - minY));
            attempts++;
            const dist = Math.hypot(targetX + btnWidth / 2 - currentCenterX, targetY + btnHeight / 2 - currentCenterY);
            if (dist > 160 || attempts > 20) break;
          } while (attempts < 20);

          if (!isEscaped) {
            isEscaped = true;

            // Ghost placeholder so Yesssir does not shift layout
            placeholder = document.createElement('div');
            placeholder.style.width = `${btnWidth}px`;
            placeholder.style.height = `${btnHeight}px`;
            placeholder.style.display = 'inline-flex';
            placeholder.style.visibility = 'hidden';
            placeholder.style.pointerEvents = 'none';
            btnNe.parentNode.insertBefore(placeholder, btnNe.nextSibling);

            btnNe.classList.add('is-escaping');
            btnNe.style.width = `${btnWidth}px`;
            btnNe.style.height = `${btnHeight}px`;
            btnNe.style.left = `${rect.left}px`;
            btnNe.style.top = `${rect.top}px`;

            void btnNe.offsetWidth;
          }

          btnNe.style.left = `${targetX}px`;
          btnNe.style.top = `${targetY}px`;

          playSound('escape');

          // The Twist: After 3 jumps, wait a moment and smoothly return home!
          if (jumpCount === 3) {
            setTimeout(() => {
              if (placeholder) {
                const homeRect = placeholder.getBoundingClientRect();
                btnNe.style.transition = 'left 0.6s cubic-bezier(0.34, 1.25, 0.64, 1), top 0.6s cubic-bezier(0.34, 1.25, 0.64, 1), transform 0.3s ease';
                btnNe.style.left = `${homeRect.left}px`;
                btnNe.style.top = `${homeRect.top}px`;

                setTimeout(() => {
                  isReturned = true;
                  btnNe.classList.remove('is-escaping');
                  btnNe.style.position = '';
                  btnNe.style.left = '';
                  btnNe.style.top = '';
                  btnNe.style.width = '';
                  btnNe.style.height = '';
                  btnNe.style.transition = '';
                  if (placeholder && placeholder.parentNode) {
                    placeholder.parentNode.removeChild(placeholder);
                    placeholder = null;
                  }
                }, 620);
              }
            }, 500);
          }
        }

        // Multi-event binding for escape / morph on mobile & desktop
        const trapEvents = ['mouseenter', 'touchstart', 'pointerdown'];
        trapEvents.forEach((evtName) => {
          btnNe.addEventListener(
            evtName,
            function (e) {
              if (isReturned || isTransformed) {
                morphToYessir();
              } else {
                escapeNeButton(e);
              }
            },
            { passive: false }
          );
        });

        btnNe.addEventListener('focus', function () {
          if (isReturned || isTransformed) {
            morphToYessir();
          }
        });

        // When clicked, NE is always intercepted
        btnNe.addEventListener('click', function (e) {
          e.preventDefault();
          e.stopPropagation();
          morphToYessir();
          triggerVictory('morphed');
        });

        // "Yesssir" Button Click Interaction
        btnAno.addEventListener('click', function () {
          triggerVictory('yesssir');
        });

        // Reset / Replay Logic
        btnReset.addEventListener('click', function () {
          jumpCount = 0;
          isEscaped = false;
          isReturned = false;
          isTransformed = false;

          if (placeholder && placeholder.parentNode) {
            placeholder.parentNode.removeChild(placeholder);
            placeholder = null;
          }

          heading.style.opacity = '0';
          setTimeout(() => {
            heading.textContent = 'Čus, uděláme to video o AI Gigafactories?';
            heading.style.opacity = '1';
            subHeading.textContent = '';
          }, 150);

          resetControl.classList.remove('visible');

          btnAno.style.display = 'inline-flex';
          btnAno.style.pointerEvents = 'auto';

          btnNe.classList.remove('is-escaping', 'falling', 'morphed-yessir');
          btnNe.textContent = 'NE';
          btnNe.setAttribute('aria-label', 'NE');
          btnNe.style.display = 'inline-flex';
          btnNe.style.position = '';
          btnNe.style.left = '';
          btnNe.style.top = '';
          btnNe.style.width = '';
          btnNe.style.height = '';
          btnNe.style.transform = '';
          btnNe.style.opacity = '';
          btnNe.style.pointerEvents = 'auto';
        });
      })();
    </script>
  </body>
</html>
